name: Pronto para o portal

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verificar:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node verificar-portal.mjs
