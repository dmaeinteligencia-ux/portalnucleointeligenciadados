name: Monitoramento das aplicações

on:
  schedule:
    - cron: '0 10,15,20 * * *' # 7h, 12h e 17h (Brasília)
  workflow_dispatch:
    inputs:
      simular:
        description: 'Só mostrar o resultado, sem gravar nem abrir alertas'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # alertas viram issues com a etiqueta "monitoramento"

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verificar sites, bancos e certificados
        run: node scripts/monitorar-aplicacoes.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIMULAR: ${{ inputs.simular && '1' || '0' }}
